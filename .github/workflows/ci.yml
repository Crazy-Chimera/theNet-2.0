name: theNet-2.0 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build "pytest>=8,<9"
      - name: Build package
        run: python -m build
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m pytest -q
