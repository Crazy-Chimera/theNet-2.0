name: theNet-2.0 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thenet
          POSTGRES_PASSWORD: thenet_test_only
          POSTGRES_DB: thenet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thenet -d thenet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THENET_TEST_POSTGRES_DSN: postgresql://thenet:thenet_test_only@localhost:5432/thenet_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build "pytest>=8,<9" "psycopg[binary]>=3.2,<4"
      - name: Build package
        run: python -m build
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m pytest -q
